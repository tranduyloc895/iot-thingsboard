{{- if .Values.notifications.enabled }}
{{- $n := .Values.notifications }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infra-alerts.fullname" . }}-notifications-config
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $n.federation.interval }}
      evaluation_interval: 30s
      external_labels:
        cluster: {{ $n.cluster | quote }}
    rule_files: [/etc/config/rules.yml]
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['{{ include "infra-alerts.fullname" . }}-alertmanager:9093']
    scrape_configs:
      - job_name: notification-prometheus
        static_configs:
          - targets: ['127.0.0.1:9090']
      - job_name: notification-alertmanager
        static_configs:
          - targets: ['{{ include "infra-alerts.fullname" . }}-alertmanager:9093']
      - job_name: cmc-federation
        honor_labels: true
        honor_timestamps: false
        scheme: {{ $n.federation.scheme }}
        metrics_path: /federate
        scrape_timeout: 20s
        params:
          'match[]':
            - 'node_cpu_seconds_total{mode="idle"}'
            - '{__name__=~"node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|kube_node_info"}'
            - '{__name__=~"container_cpu_usage_seconds_total|container_memory_working_set_bytes|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_horizontalpodautoscaler_status_current_replicas",namespace=~"{{ $n.namespaceRegex }}"}'
        static_configs:
          - targets: [{{ $n.federation.target | quote }}]
{{- if $n.ingressScrape.enabled }}
      - job_name: ingress-nginx-requests
        honor_labels: true
        dns_sd_configs:
          - names: [{{ $n.ingressScrape.dnsName | quote }}]
            type: A
            port: {{ $n.ingressScrape.port }}
            refresh_interval: 30s
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: nginx_ingress_controller_requests
            action: keep
          - source_labels: [namespace]
            regex: {{ $n.namespaceRegex | quote }}
            action: keep
{{- end }}
  rules.yml: |
{{ .Files.Get "files/notification-rules.yaml" | replace "__NODE_CPU__" (toString $n.thresholds.nodeCpuPercent) | replace "__NODE_MEMORY__" (toString $n.thresholds.nodeMemoryPercent) | replace "__CPU_REQUESTS__" (toString $n.thresholds.podCpuRequestsRatio) | replace "__MEMORY_REQUESTS__" (toString $n.thresholds.podMemoryRequestsRatio) | replace "__MEMORY_LIMITS__" (toString $n.thresholds.podMemoryLimitsRatio) | replace "__RPS__" (toString $n.thresholds.ingressRequestsPerSecond) | replace "__DURATION__" $n.thresholds.duration | replace "__NAMESPACES__" $n.namespaceRegex | indent 4 }}
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: discord-infra
      group_by: [alertname, cluster, namespace, instance, pod, horizontalpodautoscaler, ingress]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: discord-scaling
          matchers: ['category="scaling"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 30m
    receivers:
      - name: discord-infra
        discord_configs:
          - webhook_url_file: /etc/discord/webhook-url
            send_resolved: true
            title: '{{ "{{ .Status | toUpper }} | {{ .CommonLabels.cluster }} | {{ .CommonLabels.alertname }}" }}'
            message: |
              {{ "{{ range .Alerts }}" }}
              {{ "{{ .Annotations.summary }}" }}
              {{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}
      - name: discord-scaling
        discord_configs:
          - webhook_url_file: /etc/discord/webhook-url
            send_resolved: false
            title: '{{ "SCALE | {{ .CommonLabels.cluster }} | {{ .CommonLabels.alertname }}" }}'
            message: |
              {{ "{{ range .Alerts }}" }}
              {{ "{{ .Annotations.summary }}" }}
              {{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}
    inhibit_rules:
      - source_matchers: ['alertname="HcmFederationUnavailable"']
        target_matchers: ['category!="monitoring"']
        equal: [cluster]
{{- end }}

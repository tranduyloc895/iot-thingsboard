rule_files:
- notification-rules.rendered.yaml
evaluation_interval: 30s
tests:
- name: HPA scale up fires with the observed replica count
  interval: 1m
  input_series:
  - series: kube_horizontalpodautoscaler_status_current_replicas{namespace="flood-portal-dev",horizontalpodautoscaler="backend"}
    values: 1 1 3 3 2 2 2 2 2 2 2 2
  alert_rule_test:
  - eval_time: 2m
    alertname: HcmHpaScaled
    exp_alerts:
    - exp_labels:
        namespace: flood-portal-dev
        horizontalpodautoscaler: backend
        severity: info
        category: scaling
      exp_annotations:
        summary: 'HPA replica count changed: flood-portal-dev/backend'
        description: 'Current observed replicas: 3. A scale up/down occurred within
          the last 5 minutes. Verify workload health.'
  - eval_time: 11m
    alertname: HcmHpaScaled
    exp_alerts: []
- name: Node count change reports new count
  interval: 1m
  input_series:
  - series: kube_node_info{node="node-a"}
    values: 1+0x8
  - series: kube_node_info{node="node-b"}
    values: _ _ 1+0x6
  alert_rule_test:
  - eval_time: 2m
    alertname: HcmNodeCountChanged
    exp_alerts:
    - exp_labels:
        severity: info
        category: scaling
      exp_annotations:
        summary: Cluster node count changed
        description: 'Current nodes: 2. Observed node count changed within 5 minutes;
          this does not prove which autoscaler/manual action caused it.'
- name: CPU requests high waits five minutes and deduplicates scraper copies
  interval: 1m
  input_series:
  - series: container_cpu_usage_seconds_total{namespace="flood-portal-dev",pod="backend",container="app",job="cadvisor"}
    values: 0+120x12
  - series: container_cpu_usage_seconds_total{namespace="flood-portal-dev",pod="backend",container="app",job="cadvisor-copy"}
    values: 0+120x12
  - series: kube_pod_container_resource_requests{namespace="flood-portal-dev",pod="backend",container="app",resource="cpu",job="ksm"}
    values: 1+0x12
  - series: kube_pod_container_resource_requests{namespace="flood-portal-dev",pod="backend",container="app",resource="cpu",job="ksm-copy"}
    values: 1+0x12
  alert_rule_test:
  - eval_time: 4m
    alertname: HcmPodCpuAboveRequests
    exp_alerts: []
  - eval_time: 7m
    alertname: HcmPodCpuAboveRequests
    exp_alerts: []
  - eval_time: 9m
    alertname: HcmPodCpuAboveRequests
    exp_alerts:
    - exp_labels:
        namespace: flood-portal-dev
        pod: backend
        severity: warning
        category: resources
      exp_annotations:
        summary: 'Pod CPU above requests: flood-portal-dev/backend'
        description: 'CPU usage (5m average): 2000mCPU. Requests: 1000mCPU. Above
          requests: 1000mCPU. Usage/requests: 200%; trigger >100% for 5m. Requests
          are reservations, not hard limits.'
- name: Zero CPU request does not cause infinity alerts
  interval: 1m
  input_series:
  - series: container_cpu_usage_seconds_total{namespace="flood-portal-dev",pod="backend",container="app"}
    values: 0+120x12
  - series: kube_pod_container_resource_requests{namespace="flood-portal-dev",pod="backend",container="app",resource="cpu"}
    values: 0+0x12
  alert_rule_test:
  - eval_time: 10m
    alertname: HcmPodCpuAboveRequests
    exp_alerts: []
- name: Ingress RPS sums independent controller counters and waits for threshold duration
  interval: 1m
  input_series:
  - series: nginx_ingress_controller_requests{namespace="flood-portal-dev",ingress="frontend",instance="controller-a"}
    values: 0+3600x15
  - series: nginx_ingress_controller_requests{namespace="flood-portal-dev",ingress="frontend",instance="controller-b"}
    values: 0+3600x15
  alert_rule_test:
  - eval_time: 4m
    alertname: HcmIngressRequestRateHigh
    exp_alerts: []
  - eval_time: 11m
    alertname: HcmIngressRequestRateHigh
    exp_alerts:
    - exp_labels:
        namespace: flood-portal-dev
        ingress: frontend
        severity: warning
        category: traffic
      exp_annotations:
        summary: 'HTTP request rate high: flood-portal-dev/frontend'
        description: 120.0 requests/sec sustained above 100 RPS. Check traffic, errors
          and capacity.
- name: Ingress below threshold stays quiet
  interval: 1m
  input_series:
  - series: nginx_ingress_controller_requests{namespace="flood-portal-dev",ingress="frontend",instance="controller-a"}
    values: 0+3600x15
  alert_rule_test:
  - eval_time: 11m
    alertname: HcmIngressRequestRateHigh
    exp_alerts: []
  - eval_time: 15m
    alertname: HcmIngressMetricsMissing
    exp_alerts: []
- name: Memory amounts deduplicate scrapes and show usage requests excess
  interval: 1m
  input_series:
  - series: container_memory_working_set_bytes{namespace="thingsboard",pod="zookeeper-0",container="zk",job="cadvisor"}
    values: 805306368+0x10
  - series: container_memory_working_set_bytes{namespace="thingsboard",pod="zookeeper-0",container="zk",job="copy"}
    values: 805306368+0x10
  - series: kube_pod_container_resource_requests{namespace="thingsboard",pod="zookeeper-0",container="zk",resource="memory"}
    values: 536870912+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: HcmPodMemoryAboveRequests
    exp_alerts:
    - exp_labels:
        namespace: thingsboard
        pod: zookeeper-0
        severity: warning
        category: resources
      exp_annotations:
        summary: 'Pod memory above requests: thingsboard/zookeeper-0'
        description: 'Usage: 768MiB. Requests: 512MiB. Above requests: 256MiB. Usage/requests:
          150%; trigger >100% for 5m. Requests are reservations, not hard limits.'
- name: Memory limit alert reports affected container rather than pod aggregate
  interval: 1m
  input_series:
  - series: container_memory_working_set_bytes{namespace="thingsboard",pod="kafka-0",container="kafka"}
    values: 1020054732+0x10
  - series: kube_pod_container_resource_limits{namespace="thingsboard",pod="kafka-0",container="kafka",resource="memory"}
    values: 1073741824+0x10
  - series: container_memory_working_set_bytes{namespace="thingsboard",pod="kafka-0",container="sidecar"}
    values: 1048576+0x10
  - series: kube_pod_container_resource_limits{namespace="thingsboard",pod="kafka-0",container="sidecar",resource="memory"}
    values: 104857600+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: HcmPodMemoryNearLimit
    exp_alerts:
    - exp_labels:
        namespace: thingsboard
        pod: kafka-0
        container: kafka
        severity: critical
        category: resources
      exp_annotations:
        summary: 'Container memory near limit: thingsboard/kafka-0/kafka'
        description: 'Usage: 972.8MiB. Limit: 1GiB. Usage/limit: 95%; trigger >90%
          for 5m. Risk of OOM kill.'
- name: Node memory includes byte amounts and percentage
  interval: 1m
  input_series:
  - series: node_memory_MemTotal_bytes{instance="node-a"}
    values: 8589934592+0x10
  - series: node_memory_MemAvailable_bytes{instance="node-a"}
    values: 1073741824+0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: HcmNodeMemoryHigh
    exp_alerts:
    - exp_labels:
        instance: node-a
        severity: warning
        category: resources
      exp_annotations:
        summary: 'Node memory high: node-a'
        description: 'Used: 7GiB. Total: 8GiB. Available: 1GiB. Utilization: 87.5%;
          trigger >85% for 5m.'

{{- $autoscaling := .Values.kafkaAutoscaling | default dict }}
{{- if and .Values.kafka.enabled ($autoscaling.enabled | default false) }}
{{- if lt (int $autoscaling.maxReplicas) (int $autoscaling.minReplicas) }}
{{- fail "kafkaAutoscaling.maxReplicas must be >= minReplicas" }}
{{- end }}
{{- if lt (int $autoscaling.minReplicas) 1 }}
{{- fail "kafkaAutoscaling.minReplicas must be >= 1" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "common.names.fullname" .Subcharts.kafka }}
  labels:
    {{- include "thingsboard.labels" . | nindent 4 }}
  annotations:
    description: "Scale-up only; partition reassignment and broker removal require manual operations."
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "common.names.fullname" .Subcharts.kafka }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    # HPA cannot evacuate Kafka partitions before deleting a broker.
    scaleDown:
      selectPolicy: Disabled
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

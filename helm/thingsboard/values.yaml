global:
  imagePullSecrets:
    - dockerhub-secret
  image:
    server: docker.io
    tag: "3.4.0"
    pullSecrets:
      - name: dockerhub-secret
    pullPolicy: IfNotPresent
  jsonLogs: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - thingsboard.web-ui.com
  # Enable or disable tls, same host as above
  tls: false
  

node:
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  loadDemo: false
  replicaCount: 1
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-node
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  port:
    http: 8080
    rpc: 9090
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  env:
    - name: JAVA_OPTS
      value: "-Xms2G -Xmx2G"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity: {}

jsexecutor:
  # kind can be either Deployment or StatefulSet
  kind: Deployment
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-js-executor
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-js-executor
            topologyKey: kubernetes.io/hostname

mqtt:
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-mqtt-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  ssl:
    enabled: false
    secret: kubernetes-secret
  port:
    number: 8081
    protocol: TCP
    name: mqtt
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8883
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    - name: JAVA_OPTS
      value: "-Xms512M -Xmx512M"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-mqtt-transport
            topologyKey: kubernetes.io/hostname

http:
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-http-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  port:
    number: 8082
    protocol: TCP
    name: http
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-http-transport
            topologyKey: kubernetes.io/hostname

coap:
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-coap-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 1
  port:
    number: 8083
    protocol: UDP
    name: coap
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity: {}

webui:
  # kind can be either Deployment or StatefulSet
  kind: Deployment
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-web-ui
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  port:
    number: 8084
    protocol: TCP
    name: http
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-web-ui
            topologyKey: kubernetes.io/hostname

cassandraInitDB:
  keyspace: thingsboard
  replication:
    class: SimpleStrategy
    factor: 1

cassandra:
  # Database can be either postgres or hybrid (entities in postgres and timeseries in cassandra)
  # for an postgresql database set cassandra.enabled as false
  # for an hybrid database set cassandra.enabled as true
  enabled: false
  replicaCount: 1
  dbUser:
    password: setplease

postgresql-ha:
  enabled: false
  nameOverride: pg
  postgresql:
    replicaCount: 0
    database: iot_thingsboard
    username: iot_thingsboard
    password: "<REPLACE_IN_DEVTRON_UI>"
  pgpool:
    replicaCount: 0
    fullnameOverride: "<REPLACE_IP_IN_DEVTRON_UI>"
    containerPort: 5432


redis:
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  # Set architecture to either standalone or replication
  architecture: standalone
  auth:
    password: setplease
  master:
    kind: Deployment
    persistence:
      enabled: false
    disableCommands:
      - FLUSHALL
    nodeSelector:
      nodegroup: workload
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  replica:
    replicaCount: 0
    persistence:
      enabled: false

kafka:
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "3.3.2"
  nodeSelector:
    nodegroup: workload
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: false
  zookeeper:
    image:
      registry: docker.io
      repository: bitnamilegacy/zookeeper
      tag: "3.9.3-debian-12-r22"
    nodeSelector:
      nodegroup: workload
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    persistence:
      enabled: false

global:
  imagePullSecrets:
    - dockerhub-secret
  image:
    server: docker.io
    tag: "3.4.0"
    pullSecrets:
      - name: dockerhub-secret
    pullPolicy: IfNotPresent
  jsonLogs: false

nameOverride: ""
fullnameOverride: ""

# The referenced Secrets are created outside Helm and never stored in Git.
# DB Secret: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
externalDatabase:
  enabled: false
  existingSecret: ""

# Redis Secret: REDIS_HOST, REDIS_PORT, REDIS_DB, REDIS_PASSWORD, TB_REDIS_SSL_ENABLED.
externalRedis:
  enabled: false
  existingSecret: ""

# Explicit opt-in for native SQL history cleanup; auto purge data older than 1 day (86400s)
telemetryRetention:
  enabled: false
  ttlSeconds: 86400
  cleanupIntervalMs: 300000

networkPolicy:
  enabled: false
  portalNamespace: flood-portal
  ingressNamespace: ingress-nginx
  ingressPodSelector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
  monitoring:
    enabled: true
    namespace: cmc-monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  dbaas:
    enabled: true
    cidr: "10.0.0.0/16"
  externalAlerts:
    enabled: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - thingsboard.web-ui.com
  # Enable or disable tls, same host as above
  tls: false
  

node:
  queueType: kafka
  zookeeperEnabled: true
  jsEvaluator: remote
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  initDb: false
  loadDemo: false
  replicaCount: 1
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-node
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  port:
    http: 8080
    rpc: 9090
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  env:
    - name: JAVA_OPTS
      value: "-Xms2G -Xmx2G"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity: {}

jsexecutor:
  enabled: true
  # Shared by TB node and JS executor when creating Kafka topics.
  # Existing topics require an explicit Kafka partition increase; see docs/JS_EXECUTOR_LAB.md.
  kafkaTopicProperties: "retention.ms:604800000;segment.bytes:26214400;retention.bytes:104857600;partitions:6;min.insync.replicas:1"
  # kind can be either Deployment or StatefulSet
  kind: Deployment
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-js-executor
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-js-executor
            topologyKey: kubernetes.io/hostname

mqtt:
  enabled: true
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-mqtt-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  ssl:
    enabled: false
    secret: kubernetes-secret
  port:
    number: 8081
    protocol: TCP
    name: mqtt
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8883
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    - name: JAVA_OPTS
      value: "-Xms256M -Xmx512M"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-mqtt-transport
            topologyKey: kubernetes.io/hostname

http:
  enabled: true
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-http-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  port:
    number: 8082
    protocol: TCP
    name: http
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    - name: JAVA_OPTS
      value: "-Xms256M -Xmx512M"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-http-transport
            topologyKey: kubernetes.io/hostname

coap:
  enabled: true
  # kind can be either Deployment or StatefulSet
  kind: StatefulSet
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-coap-transport
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 1
  port:
    number: 8083
    protocol: UDP
    name: coap
  timeout: 10000
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "250m"
  env:
    - name: JAVA_OPTS
      value: "-Xms256M -Xmx512M"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity: {}

webui:
  enabled: true
  # kind can be either Deployment or StatefulSet
  kind: Deployment
  imagePullSecrets:
    - name: dockerhub-secret
  image:
    repository: thingsboard/tb-web-ui
    # Overrides the global image values
    #server: docker.io
    #pullPolicy: Always
    #tag: "X.Y.Z"
  replicaCount: 2
  port:
    number: 8084
    protocol: TCP
    name: http
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  nodeSelector:
    nodegroup: workload
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tb-web-ui
            topologyKey: kubernetes.io/hostname

cassandraInitDB:
  keyspace: thingsboard
  replication:
    class: SimpleStrategy
    factor: 1

cassandra:
  # Database can be either postgres or hybrid (entities in postgres and timeseries in cassandra)
  # for an postgresql database set cassandra.enabled as false
  # for an hybrid database set cassandra.enabled as true
  enabled: false
  replicaCount: 1
  dbUser:
    password: setplease

postgresql-ha:
  enabled: false
  nameOverride: pg
  postgresql:
    replicaCount: 0
    database: iot_thingsboard
    username: iot_thingsboard
    password: "<REPLACE_IN_DEVTRON_UI>"
  pgpool:
    replicaCount: 0
    fullnameOverride: "<REPLACE_IP_IN_DEVTRON_UI>"
    containerPort: 5432


redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  # Set architecture to either standalone or replication
  architecture: standalone
  auth:
    password: setplease
  master:
    kind: Deployment
    persistence:
      enabled: false
    disableCommands:
      - FLUSHALL
    nodeSelector:
      nodegroup: workload
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  replica:
    replicaCount: 0
    persistence:
      enabled: false

# Parent-chart HPA for the vendored Kafka chart. Never automatically scale down.
# Existing Kafka partitions are NOT automatically moved to added brokers.
kafkaAutoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

kafka:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "3.3.2"
  nodeSelector:
    nodegroup: workload
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: false
  zookeeper:
    image:
      registry: docker.io
      repository: bitnamilegacy/zookeeper
      tag: "3.9.3-debian-12-r22"
    nodeSelector:
      nodegroup: workload
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    persistence:
      enabled: false

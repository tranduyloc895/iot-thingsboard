replicaCount: 2

image:
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nodeSelector:
  nodegroup: workload

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: flood.web-ui.com
      paths:
        - path: /
          pathType: Prefix

# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: false
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:5f172fe50d0074a7bff466f133e218b4fe108c2828d7c89abed242234e59f5c4"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "7ece8fb5ad783a4747fa68e75552d655dea2b122"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx-dev
  className: nginx-dev
  enabled: true
  hosts:
  - host: flood.dev.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 1
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx-dev


# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: false
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:2367506958c8163e8da90c8d45d388d17b7eda948f28523d21defbe63c036890"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "49bbe8a05d690aec4e2a9265cfccf57bbee6dfde"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx-dev
  className: nginx-dev
  enabled: true
  hosts:
  - host: flood.dev.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 1
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx-dev


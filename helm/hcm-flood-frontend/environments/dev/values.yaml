# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: false
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:b3f6762040e05db22875af2c394fe3d7bb279a48367a3e3afd82398c6f790165"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "8e0a5e2e7fa919ae0bfe798f512bf17973d3a297"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
  className: nginx
  enabled: true
  hosts:
  - host: flood.dev.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 1
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true


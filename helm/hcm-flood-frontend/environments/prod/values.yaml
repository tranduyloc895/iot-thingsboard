# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:ebf4ce8b5b596b51e1ac8efd4da09be41f8b8e0cf7c07d89260730fa44a4ee42"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "379dd745fc91d34b864bdf7f7de415e3cf0e2dfa"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true


# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:dde4a0a49da4847e6a8d75482b36d2891f59302c69c924df8c742417f0d7a99a"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "f4de1cb8f77bbda5669aff9ca6fe47c3d9dbd02e"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true


# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
image:
  digest: "sha256:b2020606642b070f0eacbbba2d40ba914a463bda63797bb23550dbcbe68a2e44"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-frontend
  tag: "b3cf98e4ff244cb73646f1531657330408c6cf11"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
service:
  port: 80
  type: ClusterIP

networkPolicy:
  enabled: true


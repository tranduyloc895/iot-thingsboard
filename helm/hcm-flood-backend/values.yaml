replicaCount: 2

image:
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  pullPolicy: IfNotPresent
  tag: "6d9e2bd32bcaa6d8384195d417c1079db83c2cd7"

imagePullSecrets: []

nodeSelector:
  nodegroup: workload

service:
  type: ClusterIP
  port: 8000

env:
  APP_ENV: "production"
  PORT: "8000"
  THINGSBOARD_URL: "http://iot-thingsboard.thingsboard.svc.cluster.local:8080"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "hcm-flood-backend"
  hosts:
    - host: flood.web-ui.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /ws
          pathType: Prefix

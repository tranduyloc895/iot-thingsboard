replicaCount: 2

image:
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  digest: ""
  pullPolicy: IfNotPresent
  tag: "6d9e2bd32bcaa6d8384195d417c1079db83c2cd7"

imagePullSecrets: []

nodeSelector:
  nodegroup: workload

service:
  type: ClusterIP
  port: 8000

env:
  APP_ENV: "production"
  PORT: "8000"
  THINGSBOARD_URL: "http://iot-thingsboard-node.thingsboard.svc.cluster.local:8080"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "hcm-flood-backend"
  hosts:
    - host: flood.web-ui.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /ws
          pathType: Prefix

# Credentials are injected from a namespace-local Kubernetes Secret.
envFrom: []

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  monitoring:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: cmc-monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  thingsboard:
    namespace: thingsboard
    port: 8080
    podSelector:
      app.kubernetes.io/name: thingsboard-node
  externalApi:
    enabled: true

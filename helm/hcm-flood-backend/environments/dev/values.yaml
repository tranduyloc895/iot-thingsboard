# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: false
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
env:
  APP_ENV: development
  PORT: '8000'
  THINGSBOARD_URL: http://thingsboard-node.iot-dev.svc.cluster.local:8080
envFrom:
- secretRef:
    name: thingsboard-api-credentials
image:
  digest: "sha256:ac267870d7ffb1de6f3e424370be995c4dc58ebb0663374ee3e078a0564a58d7"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  tag: "6a5465e8ae30ff9711c588ad869df5b66734aba6"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: hcm-flood-backend
  className: nginx
  enabled: true
  hosts:
  - host: flood.dev.web-ui.com
    paths:
    - path: /api
      pathType: Prefix
    - path: /ws
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  port: 8000
  type: ClusterIP

networkPolicy:
  enabled: true
  thingsboard:
    namespace: iot-dev


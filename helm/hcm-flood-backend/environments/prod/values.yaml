# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
env:
  APP_ENV: production
  PORT: '8000'
  THINGSBOARD_URL: http://thingsboard-node.iot-prod.svc.cluster.local:8080
envFrom:
- secretRef:
    name: thingsboard-api-credentials
image:
  digest: "sha256:3ec8d9ef1e63160e7725a856e798d7dbe24558ac097b2ed141cad78dddc50fcd"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  tag: "2a298c34a3cecacba380e6c0a8638adb1004841f"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: hcm-flood-backend
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /api
      pathType: Prefix
    - path: /ws
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  port: 8000
  type: ClusterIP

networkPolicy:
  enabled: true
  thingsboard:
    namespace: thingsboard


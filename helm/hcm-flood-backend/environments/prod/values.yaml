# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
env:
  APP_ENV: production
  PORT: '8000'
  THINGSBOARD_URL: http://iot-thingsboard-node.thingsboard.svc.cluster.local:8080
envFrom:
- secretRef:
    name: thingsboard-api-credentials
image:
  digest: "sha256:182b2561c0c131fa5b8718f1415680ca21e673b277b0dd6f1ac629e31d7b5787"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  tag: "717f403db5b3d2df8f2e0c10a57c10ea584b4785"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: hcm-flood-backend
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /api
      pathType: Prefix
    - path: /ws
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  port: 8000
  type: ClusterIP

networkPolicy:
  enabled: true
  thingsboard:
    namespace: thingsboard


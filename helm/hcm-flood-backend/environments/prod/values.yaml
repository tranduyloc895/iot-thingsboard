# Environment image is explicit; CI only updates dev.
autoscaling:
  enabled: true
  maxReplicas: 6
  minReplicas: 2
  targetCPUUtilizationPercentage: 70
env:
  APP_ENV: production
  PORT: '8000'
  THINGSBOARD_URL: http://iot-thingsboard-node.thingsboard.svc.cluster.local:8080
envFrom:
- secretRef:
    name: thingsboard-api-credentials
image:
  digest: "sha256:6b1f819c4f2429d0e2232af722f74732c45273a21e3fc2bde7ca3bbc969c93ef"
  pullPolicy: IfNotPresent
  repository: ghcr.io/tranduyloc895/hcm-flood-backend
  tag: "f4de1cb8f77bbda5669aff9ca6fe47c3d9dbd02e"
imagePullSecrets: []
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: hcm-flood-backend
  className: nginx
  enabled: true
  hosts:
  - host: flood.web-ui.com
    paths:
    - path: /api
      pathType: Prefix
    - path: /ws
      pathType: Prefix
nodeSelector:
  nodegroup: workload
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  port: 8000
  type: ClusterIP

networkPolicy:
  enabled: true
  thingsboard:
    namespace: thingsboard


apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-loki-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: {{ if .Values.loki.s3.enabled }}s3{{ else }}filesystem{{ end }}
          schema: v13
          index:
            prefix: index_
            period: 24h

    {{- if .Values.loki.s3.enabled }}
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      aws:
        endpoint: ${S3_ENDPOINT}
        bucketnames: ${S3_BUCKET}
        access_key_id: ${S3_ACCESS_KEY}
        secret_access_key: ${S3_SECRET_KEY}
        s3forcepathstyle: true
        insecure: {{ .Values.loki.s3.insecure | default false }}
    {{- else }}
    storage_config:
      filesystem:
        directory: /var/loki/chunks
    {{- end }}

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 720h
      max_query_lookback: 720h
      max_query_length: 720h
      max_query_parallelism: 8
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 20MB

    compactor:
      working_directory: /var/loki/compactor
      shared_store: {{ if .Values.loki.s3.enabled }}s3{{ else }}filesystem{{ end }}
      retention_enabled: true
      compaction_interval: 10m
      retention_delete_delay: 2h

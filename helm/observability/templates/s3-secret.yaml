{{- if and .Values.loki.s3.enabled .Values.loki.s3.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-s3-secret" (include "observability.fullname" .)) .Values.loki.s3.secret.name }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.loki.s3.secret.accessKey | b64enc | quote }}
  secret-key: {{ .Values.loki.s3.secret.secretKey | b64enc | quote }}
{{- end }}

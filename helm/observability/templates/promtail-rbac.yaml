apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.fullname" . }}-promtail
  labels:
    app.kubernetes.io/component: promtail
    {{- include "observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability.fullname" . }}-promtail
  labels:
    app.kubernetes.io/component: promtail
    {{- include "observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability.fullname" . }}-promtail
  labels:
    app.kubernetes.io/component: promtail
    {{- include "observability.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability.fullname" . }}-promtail
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "observability.fullname" . }}-promtail
  apiGroup: rbac.authorization.k8s.io

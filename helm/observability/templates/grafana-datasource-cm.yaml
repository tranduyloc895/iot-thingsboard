apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-grafana-datasources
  labels:
    app.kubernetes.io/component: grafana
    {{- include "observability.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: CMC-Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.grafana.datasources.prometheusUrl | quote }}
        isDefault: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
        editable: true
      - name: Loki
        type: loki
        access: proxy
        url: "http://{{ include "observability.fullname" . }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: CMC-Prometheus
              matcherRegex: "traceID=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
        editable: true

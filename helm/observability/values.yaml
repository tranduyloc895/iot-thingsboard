# Default values for observability chart (Grafana + Loki S3 + Promtail + CMC Prometheus).

nameOverride: ""
fullnameOverride: "observability"

# Optional Discord alerting. Create the external Secret before enabling.
notifications:
  enabled: false
  cluster: hcm-flood-cmc
  namespaceRegex: "iot-dev|iot-prod"
  discordSecretName: discord-infra-webhook
  discordSecretKey: webhook-url
  federation:
    scheme: http
    target: prometheus-server.cmc-monitoring.svc.cluster.local:80
    namespace: cmc-monitoring
    interval: 30s
  thresholds:
    nodeCpuPercent: 80
    nodeMemoryPercent: 85
    podCpuRequestsRatio: 1
    podMemoryRequestsRatio: 1
    podMemoryLimitsRatio: 0.9
    ingressRequestsPerSecond: 100
    duration: 5m
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
  networkPolicy:
    enabled: true

# Ghim chặt các dịch vụ nền tảng vào System NodeGroup
nodeSelector:
  system:
    cmccloud-k8s-nodegroups: system

# ==========================================
# 1. LOKI (Single Binary - Lưu trữ Log lên CMC S3)
# ==========================================
loki:
  image:
    repository: grafana/loki
    tag: "2.9.8"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  s3:
    enabled: true
    # Điền URL endpoint S3 của CMC Cloud
    endpoint: "https://s3.hcm-5.cloud.cmctelecom.vn"
    bucket: "hcm-flood-logs"
    region: "hcm-5"
    insecure: false

    # Cấu hình Kubernetes Secret cho Access Key & Secret Key
    secret:
      create: false
      name: "cmc-s3-secret"
      accessKey: ""
      secretKey: ""

# ==========================================
# 2. PROMTAIL (Gom log từ tất cả các Pods)
# ==========================================
promtail:
  image:
    repository: grafana/promtail
    tag: "2.9.8"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ==========================================
# 3. GRAFANA (Giao diện Giám sát & Tra cứu Log)
# ==========================================
grafana:
  image:
    repository: grafana/grafana
    tag: "11.2.0"
    pullPolicy: IfNotPresent

  adminUser: "admin"
  adminPassword: "admin_password_123"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

  datasources:
    # URL Service nội bộ của Prometheus do CMC cài đặt sẵn trong cmc-monitoring
    prometheusUrl: "http://prometheus-server.cmc-monitoring:80"

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - host: grafana.flood.web-ui.com
        paths:
          - path: /
            pathType: Prefix

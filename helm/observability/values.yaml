# Default values for observability chart (Grafana + Loki S3 + Promtail + CMC Prometheus).

nameOverride: ""
fullnameOverride: "observability"

# Ghim chặt các dịch vụ nền tảng vào System NodeGroup
nodeSelector:
  system:
    cmccloud-k8s-nodegroups: system

# ==========================================
# 1. LOKI (Single Binary - Lưu trữ Log lên CMC S3)
# ==========================================
loki:
  image:
    repository: grafana/loki
    tag: "2.9.8"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  s3:
    enabled: true
    # Điền URL endpoint S3 của CMC Cloud (ví dụ: https://s3.cmccloud.vn hoặc tương đương)
    endpoint: "https://s3.cmccloud.vn"
    bucket: "hcm-flood-logs"
    region: "hcm-1"
    insecure: false

    # Cấu hình Kubernetes Secret cho Access Key & Secret Key
    secret:
      create: true
      name: "cmc-s3-secret"
      accessKey: "REPLACE_WITH_CMC_S3_ACCESS_KEY"
      secretKey: "REPLACE_WITH_CMC_S3_SECRET_KEY"

# ==========================================
# 2. PROMTAIL (Gom log từ tất cả các Pods)
# ==========================================
promtail:
  image:
    repository: grafana/promtail
    tag: "2.9.8"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ==========================================
# 3. GRAFANA (Giao diện Giám sát & Tra cứu Log)
# ==========================================
grafana:
  image:
    repository: grafana/grafana
    tag: "11.2.0"
    pullPolicy: IfNotPresent

  adminUser: "admin"
  adminPassword: "admin_password_123"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

  datasources:
    # URL Service nội bộ của Prometheus do CMC cài đặt sẵn trong cmc-monitoring
    prometheusUrl: "http://prometheus-server.cmc-monitoring:80"

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - host: grafana.flood.web-ui.com
        paths:
          - path: /
            pathType: Prefix

  },
  "spec": {
    "destination": {
      "namespace": "flood-portal",
      "server": "https://kubernetes.default.svc"
    },
    "project": "default",
    "source": {
      "helm": {
        "releaseName": "hcm-flood-backend",
        "valueFiles": [
          "environments/prod/values.yaml"
        ]
      },
      "path": "helm/hcm-flood-backend",
      "repoURL": "https://github.com/tranduyloc895/iot-thingsboard.git",
      "targetRevision": "main"
    },
    "syncPolicy": {
      "automated": {
        "prune": true,
        "selfHeal": true

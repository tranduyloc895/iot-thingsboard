services:
  station-001:
    build: .
    image: hcm-station-simulator:local
    restart: unless-stopped
    volumes:
      - simulator-state:/state
    environment:
      PYTHONUNBUFFERED: '1'
      NODE_INDEX: '0'
      DEVICE_NAME: VN-HCM-001
      STATE_DIR: /state
      THINGSBOARD_HOST: ${THINGSBOARD_HOST:-10.0.0.225}
      PORT: ${PORT:-1883}
      PROVISION_KEY: ${PROVISION_KEY:-}
      PROVISION_SECRET: ${PROVISION_SECRET:-}

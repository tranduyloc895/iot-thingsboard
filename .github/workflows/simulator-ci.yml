name: Simulator CI - Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'simulator/**'
      - '.github/workflows/simulator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Simulator Image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          tags: |
            ghcr.io/tranduyloc895/hcm-vehicle-simulator:latest
            ghcr.io/tranduyloc895/hcm-vehicle-simulator:${{ github.sha }}

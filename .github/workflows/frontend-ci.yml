name: Frontend CI - Build & Push

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/security.yml'
      - '.github/security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-frontend:
    timeout-minutes: 70
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      SECURITY_GATE_MODE: ${{ vars.SECURITY_GATE_MODE || 'report-only' }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name security artifact
        id: report-id
        run: echo "name=security-frontend-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Scan dependencies, secrets, IaC and code
        run: python3 .github/security/scan.py source --output security-reports/source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Frontend for scanning
        id: build-local
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/tranduyloc895/hcm-flood-frontend:${{ github.sha }}

      - name: Export exact image for isolated scanning
        env:
          IMAGE: ghcr.io/tranduyloc895/hcm-flood-frontend:${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-image"
          docker save "$IMAGE" -o "$RUNNER_TEMP/security-image/image.tar"

      - name: Scan image before publishing
        run: python3 .github/security/scan.py image --image-archive "$RUNNER_TEMP/security-image/image.tar" --output security-reports/image

      - name: Combine security reports
        if: always()
        run: python3 .github/security/bundle.py --component frontend --output security-reports

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.report-id.outputs.name }}
          path: |
            security-reports/*.html
            security-reports/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image and resolve registry digest
        id: build
        env:
          IMAGE: ghcr.io/tranduyloc895/hcm-flood-frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Dev GitOps writes stay on dev; main only changes through a reviewed promotion PR.
      - name: Checkout deployment configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          path: deployment-config
          fetch-depth: 0

      - name: Update dev image only
        id: publish-dev
        working-directory: deployment-config
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          values="helm/hcm-flood-frontend/environments/dev/values.yaml"
          [[ $(grep -c '^  tag:' "$values") -eq 1 ]]
          [[ $(grep -c '^  digest:' "$values") -eq 1 ]]
          sed -i -E "s|^  tag:.*$|  tag: \"$IMAGE_TAG\"|; s|^  digest:.*$|  digest: \"$IMAGE_DIGEST\"|" "$values"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/hcm-flood-frontend/environments/dev/values.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(dev): update frontend image to $IMAGE_TAG [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin dev
              if git push origin HEAD:dev; then
                echo "config_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 2
            done
            echo "Could not push dev image after five attempts" >&2
            exit 1
          fi
          echo "config_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open production promotion PR
        working-directory: deployment-config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DEV_CONFIG_REVISION: ${{ steps.publish-dev.outputs.config_revision }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEV_CONFIG_REVISION" =~ ^[0-9a-f]{40}$ ]]
          # One immutable candidate per run: a later dev build does not rewrite this PR.
          branch="codex/promote-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin main
          git switch -c "$branch" origin/main
          values="helm/hcm-flood-frontend/environments/prod/values.yaml"
          dev_values="helm/hcm-flood-frontend/environments/dev/values.yaml"
          [[ $(grep -c '^  tag:' "$values") -eq 1 ]]
          [[ $(grep -c '^  digest:' "$values") -eq 1 ]]
          # Verify the immutable candidate was actually recorded on dev.
          dev_snapshot=$(git show "$DEV_CONFIG_REVISION:$dev_values")
          [[ "$(printf '%s\n' "$dev_snapshot" | grep '^  tag:')" == "  tag: \"$IMAGE_TAG\"" ]]
          [[ "$(printf '%s\n' "$dev_snapshot" | grep '^  digest:')" == "  digest: \"$IMAGE_DIGEST\"" ]]
          # The digest must address the same repository in both environments.
          [[ "$(grep '^  repository:' "$values")" == "$(printf '%s\n' "$dev_snapshot" | grep '^  repository:')" ]]
          sed -i -E "s|^  tag:.*$|  tag: \"$IMAGE_TAG\"|; s|^  digest:.*$|  digest: \"$IMAGE_DIGEST\"|" "$values"
          if git diff --quiet -- "$values"; then
            echo "Production already references this image; no PR needed."
            exit 0
          fi
          git add -- "$values"
          git commit -m "chore(prod): promote frontend image $IMAGE_TAG"
          git push -u origin "$branch"
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          {
            printf 'Promote the frontend image built from dev to production. No rebuild.\n\n'
            printf -- '- Source commit: %s\n- Dev configuration commit: %s\n- Image: ghcr.io/tranduyloc895/hcm-flood-frontend@%s\n' "$IMAGE_TAG" "$DEV_CONFIG_REVISION" "$IMAGE_DIGEST"
            printf -- '- CI run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Only prod image.tag/image.digest change. The dev image commit stays on branch dev; main is unchanged until this PR is merged.\n\n'
            printf 'Security mode: %s (report-only is a demo bypass; inspect HTML artifacts).\n\n' "$SECURITY_GATE_MODE"
            printf 'Before merging, verify this exact digest in dev and record the test result in this PR.\n'
            printf 'A newer dev build does not change the image in this PR. Merge activates ArgoCD prod sync.\n'
          } > "$body_file"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Promote frontend to prod: ${IMAGE_TAG:0:12}" --body-file "$body_file")
          printf 'Production promotion PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

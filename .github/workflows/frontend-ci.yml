name: Frontend CI - Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/tranduyloc895/hcm-flood-frontend:latest
            ghcr.io/tranduyloc895/hcm-flood-frontend:${{ github.sha }}

      - name: Update Helm values and commit back
        run: |
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' helm/hcm-flood-frontend/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/hcm-flood-frontend/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): update frontend image tag to ${{ github.sha }} [skip ci]" && git push origin main)

name: Backend CI - Build & Push

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-backend:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/tranduyloc895/hcm-flood-backend:${{ github.sha }}

      # Build uses dev source; deployment config is independently checked out from main.
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          ref: main
          path: deployment-config
          fetch-depth: 0

      - name: Update dev image only
        id: publish-dev
        working-directory: deployment-config
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          values="helm/hcm-flood-backend/environments/dev/values.yaml"
          [[ $(grep -c '^  tag:' "$values") -eq 1 ]]
          [[ $(grep -c '^  digest:' "$values") -eq 1 ]]
          sed -i -E "s|^  tag:.*$|  tag: \"$IMAGE_TAG\"|; s|^  digest:.*$|  digest: \"$IMAGE_DIGEST\"|" "$values"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/hcm-flood-backend/environments/dev/values.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(dev): update backend image to $IMAGE_TAG [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "config_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 2
            done
            echo "Could not push dev image after five attempts" >&2
            exit 1
          fi
          echo "config_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open production promotion PR
        working-directory: deployment-config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DEV_CONFIG_REVISION: ${{ steps.publish-dev.outputs.config_revision }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEV_CONFIG_REVISION" =~ ^[0-9a-f]{40}$ ]]
          # One immutable candidate per run: a later dev build does not rewrite this PR.
          branch="codex/promote-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin main
          git switch -c "$branch" origin/main
          values="helm/hcm-flood-backend/environments/prod/values.yaml"
          dev_values="helm/hcm-flood-backend/environments/dev/values.yaml"
          [[ $(grep -c '^  tag:' "$values") -eq 1 ]]
          [[ $(grep -c '^  digest:' "$values") -eq 1 ]]
          # The digest must address the same repository in both environments.
          [[ "$(grep '^  repository:' "$values")" == "$(grep '^  repository:' "$dev_values")" ]]
          sed -i -E "s|^  tag:.*$|  tag: \"$IMAGE_TAG\"|; s|^  digest:.*$|  digest: \"$IMAGE_DIGEST\"|" "$values"
          if git diff --quiet -- "$values"; then
            echo "Production already references this image; no PR needed."
            exit 0
          fi
          git add -- "$values"
          git commit -m "chore(prod): promote backend image $IMAGE_TAG"
          git push -u origin "$branch"
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          {
            printf 'Promote the backend image built from dev to production. No rebuild.\n\n'
            printf -- '- Source commit: %s\n- Dev configuration commit: %s\n- Image: ghcr.io/tranduyloc895/hcm-flood-backend@%s\n' "$IMAGE_TAG" "$DEV_CONFIG_REVISION" "$IMAGE_DIGEST"
            printf -- '- CI run: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Only prod image.tag/image.digest change. Dev/prod configuration and Secrets stay separate.\n\n'
            printf 'Before merging, verify this exact digest in dev and record the test result in this PR.\n'
            printf 'A newer dev build does not change the image in this PR. Merge activates ArgoCD prod sync.\n'
          } > "$body_file"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Promote backend to prod: ${IMAGE_TAG:0:12}" --body-file "$body_file")
          printf 'Production promotion PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
